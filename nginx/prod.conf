worker_processes auto;
events { worker_connections 1024; }

http {
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$request_time"';

  access_log  /var/log/nginx/access.log  main;
  error_log /var/log/nginx/error.log warn;

  upstream backend_pool {
    ip_hash; # simple sticky by client IP; for more advanced sticky use sticky module or ingress
    server backend:5000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Replica-Id $http_x_replica_id;

      # timeouts suitable for websockets
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      # health check endpoint proxying
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }

    location /metrics {
      proxy_pass http://backend_pool/metrics;
    }
  }
}
