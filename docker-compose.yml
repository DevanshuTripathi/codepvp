version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_RAPID_API_KEY: ${VITE_RAPID_API_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_JUDGE0_URL: ${VITE_JUDGE0_URL}
    container_name: codepvp_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  
  backend:
    build :
      context: ./backend
      dockerfile: Dockerfile
    container_name: codepvp_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - REDIS_PASS=${REDIS_PASS}
      - JUDGE=${VITE_JUDGE0_URL}
      - JUDGE1=${VITE_JUDGE1_URL}
      - JUDGE2=${VITE_JUDGE2_URL}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
  caddy:
    image: caddy:2
    container_name: codepvp_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config: