global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

# Note: When running with multiple replicas behind a load balancer, configure Prometheus to scrape each replica
# either by listing their hostnames or by using a service discovery mechanism.
